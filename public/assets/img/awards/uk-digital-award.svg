<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0A0A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Medal Ribbon -->
  <path d="M 35 75 L 35 60 L 45 60 L 45 75 Z" fill="#4169E1" filter="url(#shadow)"/>
  <path d="M 30 60 L 50 60 L 48 65 L 32 65 Z" fill="#1E90FF" filter="url(#shadow)"/>
  
  <!-- Medal Circle -->
  <circle cx="40" cy="40" r="25" fill="url(#silverGradient)" filter="url(#shadow)"/>
  <circle cx="40" cy="40" r="22" fill="url(#silverGradient)" opacity="0.8"/>
  
  <!-- Medal Border -->
  <circle cx="40" cy="40" r="25" stroke="#696969" stroke-width="2" fill="none"/>
  
  <!-- Award Text -->
  <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2F4F4F">UK</text>
  <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#2F4F4F">DIGITAL</text>
  <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#2F4F4F">2023</text>
  
  <!-- Crown Icon -->
  <path d="M 30 25 L 35 20 L 40 25 L 45 20 L 50 25 L 48 30 L 32 30 Z" fill="#FFD700"/>
  <circle cx="35" cy="28" r="1" fill="#FFD700"/>
  <circle cx="40" cy="28" r="1" fill="#FFD700"/>
  <circle cx="45" cy="28" r="1" fill="#FFD700"/>
  
  <!-- Shine Effect -->
  <ellipse cx="35" cy="35" rx="10" ry="4" fill="rgba(255,255,255,0.4)"/>
</svg> 