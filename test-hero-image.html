<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Image Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .image-test {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .image-test img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔍 Hero Image Test</h1>
        <p>Testing if the s-men2.png image loads correctly:</p>
        
        <div class="image-test">
            <h3>Direct Image Load Test:</h3>
            <img id="testImage" src="assets/img/slider/s-men2.png" alt="Hero Image Test" onload="imageLoaded()" onerror="imageError()">
            <div id="imageStatus" class="status">Loading...</div>
        </div>
        
        <div class="image-test">
            <h3>Background Image Test:</h3>
            <div id="bgTest" style="width: 300px; height: 200px; background: url('assets/img/slider/s-men2.png') center/contain no-repeat; border: 1px solid #ccc;">
            </div>
        </div>
        
        <div class="image-test">
            <h3>Other Hero Images:</h3>
            <p>Circle shape:</p>
            <img src="assets/img/slider/s-circle.png" alt="Circle shape" style="max-width: 100px;">
            <p>Logo:</p>
            <img src="assets/img/rebirted.png" alt="Logo" style="max-width: 200px;">
        </div>
    </div>

    <script>
        function imageLoaded() {
            document.getElementById('imageStatus').innerHTML = '✅ Image loaded successfully!';
            document.getElementById('imageStatus').className = 'status success';
        }
        
        function imageError() {
            document.getElementById('imageStatus').innerHTML = '❌ Failed to load image!';
            document.getElementById('imageStatus').className = 'status error';
        }
        
        // Test if image exists by checking dimensions
        setTimeout(() => {
            const img = document.getElementById('testImage');
            if (img.naturalWidth === 0) {
                imageError();
            }
        }, 2000);
    </script>
</body>
</html>
