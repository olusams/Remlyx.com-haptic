<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="googleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FBBC04;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285F4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" rx="8" ry="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Google Logo -->
  <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#googleGradient)">Google</text>
  
  <!-- Ads text -->
  <text x="20" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#666">Ads Partner</text>
  
  <!-- Badge icon -->
  <circle cx="160" cy="40" r="15" fill="#4285F4"/>
  <path d="M155 40 L159 44 L165 36" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
