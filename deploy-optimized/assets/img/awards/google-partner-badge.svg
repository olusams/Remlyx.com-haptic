<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="googleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FBBC05;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#EA4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285F4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Badge Background -->
  <rect x="10" y="10" width="60" height="60" rx="12" fill="white" stroke="url(#googleGradient)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Google Logo -->
  <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4285F4">Google</text>
  
  <!-- Partner Text -->
  <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34A853">PARTNER</text>
  
  <!-- Certification Icon -->
  <circle cx="40" cy="52" r="8" fill="url(#googleGradient)"/>
  <path d="M 36 52 L 38 54 L 44 48" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Year -->
  <text x="40" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#666666">2024</text>
  
  <!-- Google Colors Accent -->
  <rect x="15" y="15" width="50" height="3" fill="url(#googleGradient)"/>
  <rect x="15" y="62" width="50" height="3" fill="url(#googleGradient)"/>
  
  <!-- Shine Effect -->
  <ellipse cx="30" cy="25" rx="8" ry="2" fill="rgba(66,133,244,0.2)"/>
</svg> 