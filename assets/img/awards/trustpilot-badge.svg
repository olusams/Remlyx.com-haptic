<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trustpilotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B67A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#009F6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00885C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Badge Background -->
  <rect x="10" y="10" width="60" height="60" rx="30" fill="url(#trustpilotGradient)" filter="url(#shadow)"/>
  <rect x="13" y="13" width="54" height="54" rx="27" fill="url(#trustpilotGradient)" opacity="0.9"/>
  
  <!-- Trustpilot Logo -->
  <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">TRUSTPILOT</text>
  
  <!-- Star Rating -->
  <g transform="translate(40, 45)">
    <polygon points="0,-4 1.2,-1.2 3.8,-1.2 1.8,1.2 2.3,3.8 0,2.5 -2.3,3.8 -1.8,1.2 -3.8,-1.2 -1.2,-1.2" fill="#FFD700"/>
  </g>
  <g transform="translate(30, 45)">
    <polygon points="0,-4 1.2,-1.2 3.8,-1.2 1.8,1.2 2.3,3.8 0,2.5 -2.3,3.8 -1.8,1.2 -3.8,-1.2 -1.2,-1.2" fill="#FFD700"/>
  </g>
  <g transform="translate(20, 45)">
    <polygon points="0,-4 1.2,-1.2 3.8,-1.2 1.8,1.2 2.3,3.8 0,2.5 -2.3,3.8 -1.8,1.2 -3.8,-1.2 -1.2,-1.2" fill="#FFD700"/>
  </g>
  <g transform="translate(10, 45)">
    <polygon points="0,-4 1.2,-1.2 3.8,-1.2 1.8,1.2 2.3,3.8 0,2.5 -2.3,3.8 -1.8,1.2 -3.8,-1.2 -1.2,-1.2" fill="#FFD700"/>
  </g>
  <g transform="translate(0, 45)">
    <polygon points="0,-4 1.2,-1.2 3.8,-1.2 1.8,1.2 2.3,3.8 0,2.5 -2.3,3.8 -1.8,1.2 -3.8,-1.2 -1.2,-1.2" fill="#FFD700"/>
  </g>
  
  <!-- Rating Text -->
  <text x="40" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">EXCELLENT</text>
  <text x="40" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">2024</text>
  
  <!-- Shine Effect -->
  <ellipse cx="30" cy="20" rx="10" ry="4" fill="rgba(255,255,255,0.3)"/>
</svg> 