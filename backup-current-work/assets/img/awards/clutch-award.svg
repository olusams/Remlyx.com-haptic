<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clutchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E55A2B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4A22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Badge Background -->
  <rect x="15" y="15" width="50" height="50" rx="25" fill="url(#clutchGradient)" filter="url(#shadow)"/>
  <rect x="18" y="18" width="44" height="44" rx="22" fill="url(#clutchGradient)" opacity="0.9"/>
  
  <!-- Clutch Logo -->
  <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CLUTCH</text>
  <text x="40" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">.CO</text>
  
  <!-- Star Rating -->
  <g transform="translate(40, 55)">
    <polygon points="0,-3 1,-1 3,-1 1.5,0.5 2.5,2.5 0,1.5 -2.5,2.5 -1.5,0.5 -3,-1 -1,-1" fill="#FFD700"/>
  </g>
  <g transform="translate(32, 55)">
    <polygon points="0,-3 1,-1 3,-1 1.5,0.5 2.5,2.5 0,1.5 -2.5,2.5 -1.5,0.5 -3,-1 -1,-1" fill="#FFD700"/>
  </g>
  <g transform="translate(24, 55)">
    <polygon points="0,-3 1,-1 3,-1 1.5,0.5 2.5,2.5 0,1.5 -2.5,2.5 -1.5,0.5 -3,-1 -1,-1" fill="#FFD700"/>
  </g>
  <g transform="translate(16, 55)">
    <polygon points="0,-3 1,-1 3,-1 1.5,0.5 2.5,2.5 0,1.5 -2.5,2.5 -1.5,0.5 -3,-1 -1,-1" fill="#FFD700"/>
  </g>
  <g transform="translate(8, 55)">
    <polygon points="0,-3 1,-1 3,-1 1.5,0.5 2.5,2.5 0,1.5 -2.5,2.5 -1.5,0.5 -3,-1 -1,-1" fill="#FFD700"/>
  </g>
  
  <!-- Year -->
  <text x="40" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">2023</text>
  
  <!-- Shine Effect -->
  <ellipse cx="30" cy="25" rx="8" ry="3" fill="rgba(255,255,255,0.3)"/>
</svg> 